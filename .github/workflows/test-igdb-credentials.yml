name: Test IGDB Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-igdb:
    name: Verify Twitch and IGDB access
    runs-on: ubuntu-latest

    steps:
      - name: Request token and query IGDB
        shell: bash
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "${IGDB_CLIENT_ID}" ]]; then
            echo "::error::IGDB_CLIENT_ID is missing."
            exit 1
          fi

          if [[ -z "${IGDB_CLIENT_SECRET}" ]]; then
            echo "::error::IGDB_CLIENT_SECRET is missing."
            exit 1
          fi

          echo "Requesting a temporary Twitch access token..."

          TOKEN_RESPONSE="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            "https://id.twitch.tv/oauth2/token" \
            --data-urlencode "client_id=${IGDB_CLIENT_ID}" \
            --data-urlencode "client_secret=${IGDB_CLIENT_SECRET}" \
            --data-urlencode "grant_type=client_credentials")"

          ACCESS_TOKEN="$(echo "${TOKEN_RESPONSE}" | jq -r '.access_token // empty')"
          EXPIRES_IN="$(echo "${TOKEN_RESPONSE}" | jq -r '.expires_in // empty')"

          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "::error::Twitch did not return an access token."
            exit 1
          fi

          echo "::add-mask::${ACCESS_TOKEN}"
          echo "Twitch authentication succeeded."
          echo "Token lifetime: ${EXPIRES_IN} seconds."

          echo "Testing the IGDB Games endpoint..."

          IGDB_RESPONSE="$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            "https://api.igdb.com/v4/games" \
            --header "Client-ID: ${IGDB_CLIENT_ID}" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            --data 'fields id,name; limit 1;')"

          RECORD_COUNT="$(echo "${IGDB_RESPONSE}" | jq 'length')"

          if [[ "${RECORD_COUNT}" -ne 1 ]]; then
            echo "::error::IGDB did not return the expected test record."
            exit 1
          fi

          GAME_NAME="$(echo "${IGDB_RESPONSE}" | jq -r '.[0].name')"

          echo "IGDB authentication succeeded."
          echo "Test record received: ${GAME_NAME}"
          echo "Play Atlas credentials are working."
