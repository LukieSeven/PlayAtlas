name: IGDB Database Pipeline Importer & Pages Deployment

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly automatic IGDB catalog update
  workflow_dispatch:
    inputs:
      operation:
        description: 'Catalog operation'
        required: true
        type: choice
        options:
          - test
          - full
          - deploy_existing
        default: test

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-importer-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests & Search Benchmarks
        run: npm test

      # --- 1. TEST MODE EXECUTION ---
      - name: Run 500-Record Test Importer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test' }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: test
          IGDB_IMPORT_LIMIT: 500
        run: npm run build:igdb-test

      - name: Run Production Build Validation (Test Mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test' }}
        run: npm run build

      - name: Upload Test Database & Build Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: igdb-test-database-${{ github.run_id }}
          path: |
            public/data/igdb_index_manifest.json
            public/data/igdb_index.json
            dist/
          retention-days: 14

      # --- 2. FULL CATALOG EXECUTION & RE-BUILD ---
      - name: Run Complete IGDB Catalog Importer
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: full
          IGDB_OUTPUT_DIR: generated/igdb-full-test
        run: npm run build:igdb-full

      - name: Verify Raw Full Catalog Output
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        run: npm run verify:igdb-full

      - name: Build Partitioned Browser Catalog
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        env:
          IGDB_FULL_CATALOG_DIR: generated/igdb-full-test
          PLAY_ATLAS_BROWSER_DATA_DIR: generated/browser-catalog-test
        run: npm run build:browser-catalog

      - name: Verify Partitioned Browser Catalog (Full Mode)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        run: npm run verify:browser-catalog generated/browser-catalog-test

      # --- 3. DEPLOY EXISTING MODE EXECUTION (Controlled Unified Restoration Step) ---
      - name: Restore Existing Catalog
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_existing' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          rm -rf \
            generated/release-download \
            generated/restored-artifact \
            generated/browser-catalog-restored \
            generated/igdb-full-restored

          mkdir -p generated/release-download

          echo "🔍 Checking for GitHub Release v1.0.0-catalog..."

          if gh release view v1.0.0-catalog --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "✅ Release v1.0.0-catalog exists. Downloading catalog archive..."

            gh release download v1.0.0-catalog \
              --repo "${GH_REPO}" \
              --pattern "play-atlas-full-catalog.zip" \
              --dir generated/release-download

            test -f generated/release-download/play-atlas-full-catalog.zip

            mkdir -p generated/browser-catalog-restored

            unzip -q \
              generated/release-download/play-atlas-full-catalog.zip \
              -d generated/browser-catalog-restored

            echo "RESTORE_SOURCE=release" >> "${GITHUB_ENV}"
            echo "BROWSER_CATALOG_DIR=generated/browser-catalog-restored" >> "${GITHUB_ENV}"
          else
            echo "⚠️ Release v1.0.0-catalog does not exist. Searching retained workflow artifacts..."

            ARTIFACT_DATA="$(
              gh api \
                "repos/${GH_REPO}/actions/artifacts?per_page=100" \
                --paginate \
                --jq '
                  [
                    .artifacts[]
                    | select(.expired == false)
                    | select(
                        (.name | startswith("play-atlas-browser-catalog-"))
                        or (.name | startswith("igdb-full-catalog-"))
                        or (.name | startswith("play-atlas-published-pages-"))
                        or (.name | startswith("igdb-test-database-"))
                      )
                  ]
                  | sort_by(.created_at)
                  | reverse
                  | .[0]
                  | {
                      id: .id,
                      name: .name,
                      created_at: .created_at
                    }
                '
            )"

            ARTIFACT_ID="$(jq -r '.id // empty' <<< "${ARTIFACT_DATA}")"
            ARTIFACT_NAME="$(jq -r '.name // empty' <<< "${ARTIFACT_DATA}")"

            if [[ -z "${ARTIFACT_ID}" || -z "${ARTIFACT_NAME}" ]]; then
              echo "::error::No suitable non-expired catalog Release or Actions artifact exists."
              exit 1
            fi

            echo "Selected artifact:"
            echo "  ID: ${ARTIFACT_ID}"
            echo "  Name: ${ARTIFACT_NAME}"

            mkdir -p generated/restored-artifact

            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > generated/restored-artifact/artifact.zip

            mkdir -p generated/restored-artifact/content
            unzip -q \
              generated/restored-artifact/artifact.zip \
              -d generated/restored-artifact/content

            # Inspect extracted content
            if [ -f "generated/restored-artifact/content/browser_catalog_manifest.json" ]; then
              echo "📦 Restored complete compressed browser catalog."
              mkdir -p generated/browser-catalog-restored
              cp -r generated/restored-artifact/content/* generated/browser-catalog-restored/
            elif [ -f "generated/restored-artifact/content/data/browser_catalog_manifest.json" ]; then
              echo "📦 Restored published pages data catalog."
              mkdir -p generated/browser-catalog-restored
              cp -r generated/restored-artifact/content/data/* generated/browser-catalog-restored/
            elif [ -f "generated/restored-artifact/content/game_index_manifest.json" ]; then
              echo "📦 Restored raw full catalog. Rebuilding compressed browser catalog..."
              mkdir -p generated/igdb-full-restored
              cp -r generated/restored-artifact/content/* generated/igdb-full-restored/
              IGDB_FULL_CATALOG_DIR=generated/igdb-full-restored PLAY_ATLAS_BROWSER_DATA_DIR=generated/browser-catalog-restored npm run build:browser-catalog
            else
              echo "::error::Unrecognized directory structure in restored artifact."
              exit 1
            fi

            echo "RESTORE_SOURCE=artifact" >> "${GITHUB_ENV}"
            echo "BROWSER_CATALOG_DIR=generated/browser-catalog-restored" >> "${GITHUB_ENV}"
          fi

      - name: Verify Restored Browser Catalog (Deploy Existing Mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_existing' }}
        run: npm run verify:browser-catalog generated/browser-catalog-restored

      # --- 4. COMMON RELEASE ASSET UPLOAD & PAGES DEPLOYMENT ---
      - name: Create or Update GitHub Release with Master ZIP Archive Asset
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_SRC=""
          if [ -f "generated/release-assets/play-atlas-full-catalog.zip" ]; then
            ZIP_SRC="generated/release-assets"
          elif [ -f "generated/release-download/play-atlas-full-catalog.zip" ]; then
            ZIP_SRC="generated/release-download"
          fi

          if [ -n "$ZIP_SRC" ]; then
            echo "📦 Publishing master ZIP archive asset to GitHub Release v1.0.0-catalog..."
            if gh release view v1.0.0-catalog --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload v1.0.0-catalog "$ZIP_SRC/play-atlas-full-catalog.zip" "$ZIP_SRC/play-atlas-full-catalog.zip.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
            else
              gh release create v1.0.0-catalog "$ZIP_SRC/play-atlas-full-catalog.zip" "$ZIP_SRC/play-atlas-full-catalog.zip.sha256" --title "Play Atlas Catalog v1.0.0" --notes "Complete Play Atlas IGDB catalog." --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh release view v1.0.0-catalog --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Prepare Build Output for Pages Deployment
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        run: |
          npm run build
          mkdir -p dist/data
          if [ -d "generated/browser-catalog-test" ]; then
            cp -r generated/browser-catalog-test/* dist/data/
          elif [ -d "generated/browser-catalog-restored" ]; then
            cp -r generated/browser-catalog-restored/* dist/data/
          fi
          rm -f dist/data/play-atlas-full-catalog.zip
          rm -f dist/data/play-atlas-full-catalog.zip.sha256

      - name: Measure Exact Published Deployment Size & Enforce 900 MB Ceiling
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        run: |
          TOTAL_BYTES=$(du -sb dist | cut -f1)
          TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES / 1048576" | bc)
          echo "📊 Published Pages Directory Size: ${TOTAL_MB} MB"
          if [ "$TOTAL_BYTES" -gt 943718400 ]; then
            echo "❌ CUTOVER BLOCKED: Deployment size exceeds safe 900 MB limit!"
            exit 1
          fi

      - name: Setup GitHub Pages Configuration
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        id: deployment
        uses: actions/deploy-pages@v4
