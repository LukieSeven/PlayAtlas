name: IGDB Database Pipeline Importer

on:
  workflow_dispatch:
    inputs:
      import_mode:
        description: 'IGDB import mode (test or full)'
        required: true
        type: choice
        options:
          - test
          - full
        default: test

jobs:
  run-importer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Normalization Unit Tests
        run: npm test

      # --- TEST MODE EXECUTION ---
      - name: Run 500-Record Test Importer
        if: ${{ inputs.import_mode == 'test' }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: test
          IGDB_IMPORT_LIMIT: 500
        run: npm run build:igdb-test

      - name: Run Production Build Validation (Test Mode)
        if: ${{ inputs.import_mode == 'test' }}
        run: npm run build

      - name: Upload Test Database & Build Artifact
        if: ${{ inputs.import_mode == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: igdb-test-database-${{ github.run_id }}
          path: |
            public/data/igdb_index_manifest.json
            public/data/igdb_index.json
            dist/
          retention-days: 14

      # --- FULL CATALOG EXECUTION ---
      - name: Run Complete IGDB Catalog Importer
        if: ${{ inputs.import_mode == 'full' }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: full
          IGDB_OUTPUT_DIR: generated/igdb-full-test
        run: npm run build:igdb-full

      - name: Verify Full Catalog Output
        if: ${{ inputs.import_mode == 'full' }}
        run: npm run verify:igdb-full

      - name: Run Production Build Validation (Full Mode)
        if: ${{ inputs.import_mode == 'full' }}
        run: npm run build

      - name: Upload Full Catalog & Build Artifact
        if: ${{ inputs.import_mode == 'full' }}
        uses: actions/upload-artifact@v6
        with:
          name: igdb-full-catalog-${{ github.run_id }}
          path: |
            generated/igdb-full-test/**
            dist/**
          retention-days: 30
