name: IGDB Database Pipeline Importer & Pages Deployment

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Weekly automatic IGDB catalog update
  workflow_dispatch:
    inputs:
      import_mode:
        description: 'IGDB import mode (test or full)'
        required: true
        type: choice
        options:
          - test
          - full
        default: full

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-importer-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests & Search Benchmarks
        run: npm test

      # --- TEST MODE EXECUTION ---
      - name: Run 500-Record Test Importer
        if: ${{ inputs.import_mode == 'test' }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: test
          IGDB_IMPORT_LIMIT: 500
        run: npm run build:igdb-test

      - name: Run Production Build Validation (Test Mode)
        if: ${{ inputs.import_mode == 'test' }}
        run: npm run build

      - name: Upload Test Database & Build Artifact
        if: ${{ inputs.import_mode == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: igdb-test-database-${{ github.run_id }}
          path: |
            public/data/igdb_index_manifest.json
            public/data/igdb_index.json
            dist/
          retention-days: 14

      # --- FULL CATALOG EXECUTION & PAGES DEPLOYMENT ---
      - name: Run Complete IGDB Catalog Importer
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: full
          IGDB_OUTPUT_DIR: generated/igdb-full-test
        run: npm run build:igdb-full

      - name: Verify Full Catalog Output
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: npm run verify:igdb-full

      - name: Build Partitioned Browser Catalog & Enforce 900 MB Ceiling
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        env:
          IGDB_FULL_CATALOG_DIR: generated/igdb-full-test
          PLAY_ATLAS_BROWSER_DATA_DIR: generated/browser-catalog-test
        run: npm run build:browser-catalog

      - name: Verify Partitioned Browser Catalog
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: npm run verify:browser-catalog

      - name: Run Production Build
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: npm run build

      - name: Copy Browser Catalog Files to Build Output (Excluding ZIP)
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          mkdir -p dist/data
          cp -r generated/browser-catalog-test/* dist/data/
          rm -f dist/data/play-atlas-full-catalog.zip
          rm -f dist/data/play-atlas-full-catalog.zip.sha256

      - name: Measure Exact Published Deployment Size & Enforce 900 MB Ceiling
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        run: |
          TOTAL_BYTES=$(du -sb dist | cut -f1)
          TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES / 1048576" | bc)
          echo "📊 Published Pages Directory Size: ${TOTAL_MB} MB"
          if [ "$TOTAL_BYTES" -gt 943718400 ]; then
            echo "❌ CUTOVER BLOCKED: Deployment size exceeds safe 900 MB limit!"
            exit 1
          fi

      - name: Create or Update GitHub Release with Master ZIP Archive Asset
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-catalog
          name: Play Atlas Full Catalog Master Release
          body: "Complete, normalized, chunked IGDB catalog archive for Play Atlas."
          files: |
            generated/browser-catalog-test/play-atlas-full-catalog.zip
            generated/browser-catalog-test/play-atlas-full-catalog.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages Configuration
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: ${{ inputs.import_mode == 'full' || github.event_name == 'schedule' || github.event_name == 'push' }}
        id: deployment
        uses: actions/deploy-pages@v4
