name: IGDB Database Pipeline Importer & Pages Deployment

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly automatic IGDB catalog update
  workflow_dispatch:
    inputs:
      operation:
        description: 'Catalog operation'
        required: true
        type: choice
        options:
          - test
          - full
          - deploy_existing
        default: test

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run-importer-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests & Search Benchmarks
        run: npm test

      # --- 1. TEST MODE EXECUTION ---
      - name: Run 500-Record Test Importer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test' }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: test
          IGDB_IMPORT_LIMIT: 500
        run: npm run build:igdb-test

      - name: Run Production Build Validation (Test Mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test' }}
        run: npm run build

      - name: Upload Test Database & Build Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'test' }}
        uses: actions/upload-artifact@v6
        with:
          name: igdb-test-database-${{ github.run_id }}
          path: |
            public/data/igdb_index_manifest.json
            public/data/igdb_index.json
            dist/
          retention-days: 14

      # --- 2. FULL CATALOG EXECUTION & RE-BUILD ---
      - name: Run Complete IGDB Catalog Importer
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_MODE: full
          IGDB_OUTPUT_DIR: generated/igdb-full-test
        run: npm run build:igdb-full

      - name: Verify Raw Full Catalog Output
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        run: npm run verify:igdb-full

      - name: Build Partitioned Browser Catalog
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        env:
          IGDB_FULL_CATALOG_DIR: generated/igdb-full-test
          PLAY_ATLAS_BROWSER_DATA_DIR: generated/browser-catalog-test
        run: npm run build:browser-catalog

      - name: Verify Partitioned Browser Catalog (Full Mode)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'full') }}
        run: npm run verify:browser-catalog -- generated/browser-catalog-test

      # --- 3. DEPLOY EXISTING MODE EXECUTION (Full Detail Restructure & Token Index Rebuilding) ---
      - name: Restore Existing Catalog & Rebuild Corrected Token Index
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_existing' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          rm -rf \
            generated/release-download \
            generated/release-restore-staging \
            generated/restored-artifact \
            generated/restored-zip-content \
            generated/browser-catalog-restored \
            generated/browser-catalog-rebuilt \
            generated/igdb-full-restored

          mkdir -p generated/release-download

          echo "🔍 Checking for GitHub Release v1.0.0-catalog..."

          IS_RELEASE_VALID=false

          if gh release view v1.0.0-catalog --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "✅ Release v1.0.0-catalog exists. Downloading catalog archive..."

            if gh release download v1.0.0-catalog --repo "${GH_REPO}" --pattern "play-atlas-full-catalog.zip" --dir generated/release-download; then
              if [ -f "generated/release-download/play-atlas-full-catalog.zip" ]; then
                echo "📦 Extracting Release archive into staging directory..."
                mkdir -p generated/release-restore-staging
                unzip -q generated/release-download/play-atlas-full-catalog.zip -d generated/release-restore-staging

                FILE_LIST_PATH="${RUNNER_TEMP:-/tmp}/release-archive-files.txt"
                find generated/release-restore-staging -maxdepth 6 -type f -print | sort > "${FILE_LIST_PATH}"

                echo "Release archive contents — first 300 files:"
                head -n 300 "${FILE_LIST_PATH}"

                TOTAL_EXTRACTED_FILES="$(wc -l < "${FILE_LIST_PATH}")"
                echo "Total extracted files: ${TOTAL_EXTRACTED_FILES}"

                MANIFEST_PATH="$(find generated/release-restore-staging -type f -name "browser_catalog_manifest.json" -print -quit)"

                if [ -n "${MANIFEST_PATH}" ]; then
                  CATALOG_ROOT="$(dirname "${MANIFEST_PATH}")"
                  echo "Candidate catalog root: ${CATALOG_ROOT}"
                  printf 'Candidate root shell-escaped: %q\n' "${CATALOG_ROOT}"

                  RECORD_COUNT="$(jq -r '.catalogRecordCount // .recordCount // 0' "${MANIFEST_PATH}")"
                  CHUNK_COUNT="$(jq -r '.fullCatalog.chunkCount // (.chunks | length) // 0' "${MANIFEST_PATH}")"
                  DETAIL_FILE_COUNT="$(find "${CATALOG_ROOT}/chunks" -maxdepth 1 -type f -name 'game_index_*.json.gz' 2>/dev/null | wc -l)"

                  echo "===================================================="
                  echo "📊 RELEASE CATALOG RESTORE DIAGNOSTIC SUMMARY"
                  echo "===================================================="
                  echo "Release Asset Filename:          play-atlas-full-catalog.zip"
                  echo "Detected Nested Catalog Root:    ${CATALOG_ROOT}"
                  echo "Record Count:                    ${RECORD_COUNT}"
                  echo "Manifest Chunk Count:            ${CHUNK_COUNT}"
                  echo "Physical Compressed Chunk Count: ${DETAIL_FILE_COUNT}"
                  echo "===================================================="

                  if [ "$RECORD_COUNT" -ge 300000 ] && [ "$CHUNK_COUNT" -ge 100 ] && [ "$DETAIL_FILE_COUNT" -ge 100 ]; then
                    mkdir -p generated/browser-catalog-restored
                    cp -a "${CATALOG_ROOT}/." generated/browser-catalog-restored/
                    IS_RELEASE_VALID=true
                  else
                    echo "⚠️ Release archive catalog totals did not pass minimum threshold validation."
                  fi
                fi
              fi
            fi
          fi

          if [ "$IS_RELEASE_VALID" = "false" ]; then
            echo "⚠️ Release v1.0.0-catalog was missing or invalid. Searching retained artifacts using priority order..."

            find_artifact_by_prefix() {
              PREFIX="$1"
              gh api "repos/${GH_REPO}/actions/artifacts?per_page=100" --paginate --jq "
                [
                  .artifacts[]
                  | select(.expired == false)
                  | select(.name | startswith(\"${PREFIX}\"))
                ]
                | sort_by(.created_at)
                | reverse
                | .[0] // empty
              "
            }

            # Priority 1: play-atlas-browser-catalog-*
            ARTIFACT_DATA="$(find_artifact_by_prefix "play-atlas-browser-catalog-")"

            # Priority 2: igdb-full-catalog-*
            if [[ -z "${ARTIFACT_DATA}" || "${ARTIFACT_DATA}" == "null" ]]; then
              ARTIFACT_DATA="$(find_artifact_by_prefix "igdb-full-catalog-")"
            fi

            # Priority 3: play-atlas-published-pages-*
            if [[ -z "${ARTIFACT_DATA}" || "${ARTIFACT_DATA}" == "null" ]]; then
              ARTIFACT_DATA="$(find_artifact_by_prefix "play-atlas-published-pages-")"
            fi

            ARTIFACT_ID="$(jq -r '.id // empty' <<< "${ARTIFACT_DATA}")"
            ARTIFACT_NAME="$(jq -r '.name // empty' <<< "${ARTIFACT_DATA}")"

            if [[ -z "${ARTIFACT_ID}" || "${ARTIFACT_ID}" == "null" || -z "${ARTIFACT_NAME}" || "${ARTIFACT_NAME}" == "null" ]]; then
              echo "::error::No suitable non-expired production catalog Release or Actions artifact exists."
              exit 1
            fi

            echo "Selected Priority Artifact:"
            echo "  ID: ${ARTIFACT_ID}"
            echo "  Name: ${ARTIFACT_NAME}"

            mkdir -p generated/restored-artifact/content

            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > generated/restored-artifact/artifact.zip

            unzip -q \
              generated/restored-artifact/artifact.zip \
              -d generated/restored-artifact/content

            ART_FILE_LIST_PATH="${RUNNER_TEMP:-/tmp}/artifact-files.txt"
            find generated/restored-artifact/content -maxdepth 7 -type f -print | sort > "${ART_FILE_LIST_PATH}"

            echo "📂 Extracted artifact structure — first 300 files:"
            head -n 300 "${ART_FILE_LIST_PATH}"

            MANIFEST_FILE="$(find generated/restored-artifact/content -type f -name "browser_catalog_manifest.json" -print -quit)"
            RAW_MANIFEST_FILE="$(find generated/restored-artifact/content -type f -name "game_index_manifest.json" -print -quit)"
            ZIP_FILE="$(find generated/restored-artifact/content -type f -name "play-atlas-full-catalog.zip" -print -quit)"

            if [ -n "${MANIFEST_FILE}" ]; then
              CATALOG_ROOT="$(dirname "${MANIFEST_FILE}")"
            elif [ -n "${RAW_MANIFEST_FILE}" ]; then
              CATALOG_ROOT="$(dirname "${RAW_MANIFEST_FILE}")"
            elif [ -n "${ZIP_FILE}" ]; then
              mkdir -p generated/restored-zip-content
              unzip -q "$ZIP_FILE" -d generated/restored-zip-content
              ZIP_MANIFEST_FILE="$(find generated/restored-zip-content -type f -name "browser_catalog_manifest.json" -print -quit)"
              CATALOG_ROOT="$(dirname "${ZIP_MANIFEST_FILE}")"
            else
              echo "::error::No valid catalog marker found in extracted artifact!"
              exit 1
            fi

            echo "Candidate catalog root: ${CATALOG_ROOT}"
            printf 'Candidate root shell-escaped: %q\n' "${CATALOG_ROOT}"

            mkdir -p generated/browser-catalog-restored
            cp -a "$CATALOG_ROOT/." generated/browser-catalog-restored/
          fi

          echo "⚙️ Rebuilding browser catalog with corrected SHA-256 token index from generated/browser-catalog-restored..."
          IGDB_FULL_CATALOG_DIR=generated/browser-catalog-restored PLAY_ATLAS_BROWSER_DATA_DIR=generated/browser-catalog-rebuilt npm run build:browser-catalog

          echo "BROWSER_CATALOG_DIR=generated/browser-catalog-rebuilt" >> "${GITHUB_ENV}"

      - name: Verify Restored Browser Catalog (Deploy Existing Mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_existing' }}
        run: npm run verify:browser-catalog -- generated/browser-catalog-rebuilt

      # --- 4. COMMON RELEASE ASSET UPLOAD & PAGES DEPLOYMENT ---
      - name: Create or Update GitHub Release with Master ZIP Archive Asset
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP_SRC=""
          if [ -f "generated/release-assets/play-atlas-full-catalog.zip" ]; then
            ZIP_SRC="generated/release-assets"
          elif [ -f "generated/release-download/play-atlas-full-catalog.zip" ]; then
            ZIP_SRC="generated/release-download"
          fi

          if [ -n "$ZIP_SRC" ]; then
            echo "📦 Publishing master ZIP archive asset to GitHub Release v1.0.0-catalog..."
            if gh release view v1.0.0-catalog --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload v1.0.0-catalog "$ZIP_SRC/play-atlas-full-catalog.zip" "$ZIP_SRC/play-atlas-full-catalog.zip.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
            else
              gh release create v1.0.0-catalog "$ZIP_SRC/play-atlas-full-catalog.zip" "$ZIP_SRC/play-atlas-full-catalog.zip.sha256" --title "Play Atlas Catalog v1.0.0" --notes "Complete Play Atlas IGDB catalog." --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
            fi
            gh release view v1.0.0-catalog --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Prepare Build Output for Pages Deployment
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        run: |
          npm run build
          mkdir -p dist/data
          if [ -d "generated/browser-catalog-rebuilt" ]; then
            cp -r generated/browser-catalog-rebuilt/* dist/data/
          elif [ -d "generated/browser-catalog-test" ]; then
            cp -r generated/browser-catalog-test/* dist/data/
          elif [ -d "generated/browser-catalog-restored" ]; then
            cp -r generated/browser-catalog-restored/* dist/data/
          fi
          rm -f dist/data/play-atlas-full-catalog.zip
          rm -f dist/data/play-atlas-full-catalog.zip.sha256

      - name: Measure Exact Published Deployment Size & Enforce 900 MB Ceiling
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        run: |
          TOTAL_BYTES=$(du -sb dist | cut -f1)
          TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES / 1048576" | bc)
          echo "📊 Published Pages Directory Size: ${TOTAL_MB} MB"
          if [ "$TOTAL_BYTES" -gt 943718400 ]; then
            echo "❌ CUTOVER BLOCKED: Deployment size exceeds safe 900 MB limit!"
            exit 1
          fi

      - name: Setup GitHub Pages Configuration
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'full' || inputs.operation == 'deploy_existing')) }}
        id: deployment
        uses: actions/deploy-pages@v4
