name: Live IGDB Database Test Importer

on:
  workflow_dispatch:

jobs:
  test-igdb-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Live 500-Record IGDB Importer
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          IGDB_IMPORT_LIMIT: 500
        run: npx tsx scripts/build-igdb-index.ts

      - name: Run Production Build Validation
        run: npm run build

      - name: Upload Test Database & Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: igdb-test-database
          path: |
            public/data/igdb_index_manifest.json
            public/data/igdb_index.json
            dist/
