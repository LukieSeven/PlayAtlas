<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="forestWash" cx="30%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2d5a3f" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#366e57" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#4a8b71" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#366e57" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="oliveHills" cx="70%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#556b2f" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#556b2f" stop-opacity="0" />
    </radialGradient>
    <filter id="landFeather" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Sea Green & Olive Forest Landmass -->
  <path d="M40 180 Q 140 60, 320 110 T 540 220 Q 580 420, 440 520 T 180 540 Q 30 460, 40 180 Z" fill="url(#forestWash)" filter="url(#landFeather)" />
  <path d="M120 240 Q 280 180, 420 280 T 480 480 Q 320 540, 180 460 Z" fill="url(#oliveHills)" filter="url(#landFeather)" />

  <!-- Shoreline Coastline Ink Contours -->
  <path d="M50 190 Q 150 70, 330 120 T 550 230 Q 590 430, 450 530 T 190 550 Q 40 470, 50 190 Z" stroke="#0f2b48" stroke-width="2" opacity="0.3" filter="url(#landFeather)" />

  <!-- Hand-Drawn Fantasy Forest Tree Cluster Icons -->
  <g stroke="#1b382b" stroke-width="1.5" opacity="0.45" fill="none">
    <!-- Tree 1 -->
    <path d="M140 280 L145 260 L150 280 Z M140 270 L145 252 L150 270 Z M145 280 L145 286" />
    <!-- Tree 2 -->
    <path d="M160 290 L166 268 L172 290 Z M160 278 L166 258 L172 278 Z M166 290 L166 297" />
    <!-- Tree 3 -->
    <path d="M180 275 L185 255 L190 275 Z M180 265 L185 248 L190 265 Z M185 275 L185 281" />

    <!-- Mountain Peaks Cluster -->
    <path d="M280 340 L300 300 L320 340 M300 300 L305 340" />
    <path d="M315 345 L330 315 L345 345 M330 315 L333 345" />
    <path d="M255 350 L272 320 L290 350" />
  </g>
</svg>
