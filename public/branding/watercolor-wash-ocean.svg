<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="oceanBloom" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2b7a94" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1b5e75" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#0f2b48" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2b7a94" stop-opacity="0" />
    </radialGradient>
    <filter id="paintFeather" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Irregular Organic Wash Pool -->
  <path d="M50 40 Q 180 10, 320 60 T 540 120 Q 580 260, 480 340 T 260 380 Q 80 340, 20 220 Z" fill="url(#oceanBloom)" filter="url(#paintFeather)" />
  
  <!-- Outer Tide Mark Line -->
  <path d="M60 50 Q 190 20, 310 70 T 530 130 Q 560 250, 470 330 T 270 370 Q 90 330, 30 210 Z" stroke="#1b5e75" stroke-width="2" opacity="0.25" filter="url(#paintFeather)" />
</svg>
