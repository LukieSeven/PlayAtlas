<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="oceanCore" cx="25%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1b5e75" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#2b7a94" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#3b9ab8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2b7a94" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldBloom" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>
    <filter id="watercolorDisplace" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Deep Ocean Blue Organic Pigment Wash -->
  <path d="M40 30 Q 220 10, 420 80 T 740 160 Q 780 380, 620 520 T 320 560 Q 100 480, 30 300 Z" fill="url(#oceanCore)" filter="url(#watercolorDisplace)" />

  <!-- Gold Accent Pigment Bloom -->
  <path d="M220 140 Q 380 90, 520 180 T 600 360 Q 480 460, 320 440 Z" fill="url(#goldBloom)" filter="url(#watercolorDisplace)" />

  <!-- Tide Mark Concentric Paint Edge Ring -->
  <path d="M60 45 Q 230 20, 410 90 T 720 170 Q 760 360, 600 500 T 310 540 Q 110 460, 45 290 Z" stroke="#0f2b48" stroke-width="2.5" opacity="0.35" filter="url(#watercolorDisplace)" />
</svg>
