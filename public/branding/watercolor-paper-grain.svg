<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" opacity="0.3">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.15 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)" fill="#000000" />
</svg>
