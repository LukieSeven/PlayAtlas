<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" fill="none">
  <defs>
    <radialGradient id="seaGreenBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#366e57" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#2b7a94" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#1b5e75" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#366e57" stop-opacity="0" />
    </radialGradient>
    <filter id="tealDisplace" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Sea Green & Teal Organic Watercolor Pool -->
  <path d="M120 100 Q 360 40, 580 120 T 640 450 Q 520 620, 310 650 T 80 430 Q 30 240, 120 100 Z" fill="url(#seaGreenBloom)" filter="url(#tealDisplace)" />

  <!-- Outer Tide Mark Edge -->
  <path d="M140 120 Q 370 60, 560 140 T 620 430 Q 500 590, 300 620 T 100 410 Q 50 250, 140 120 Z" stroke="#16385c" stroke-width="2" opacity="0.3" filter="url(#tealDisplace)" />
</svg>
